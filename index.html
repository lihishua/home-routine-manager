<head>

    <meta property="og:image" content="https://loomi-home.com/apple-touch-icon.png">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="style.css?v=277">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9zux6N8SJcYKPyvjlexhtTyLmVqpzg2w",
            authDomain: "loomi-home.firebaseapp.com",
            projectId: "loomi-home",
            storageBucket: "loomi-home.firebasestorage.app",
            messagingSenderId: "864873233249",
            appId: "1:864873233249:web:b09c5957f4036577b3e320"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseGetDoc = getDoc;
        window.firebaseOnSnapshot = onSnapshot;

        let currentUser = null;
        window.currentFirebaseUser = null;

        // 1. MONITOR AUTH STATUS
        onAuthStateChanged(auth, (user) => {
            const authOverlay = document.getElementById('auth-container');
            const loadingScreen = document.getElementById('loading-screen');
            if (user) {
                currentUser = user;
                window.currentFirebaseUser = user;
                window.isGuestMode = false;
                if (authOverlay) authOverlay.style.display = 'none';
                // Check for daily reset
                checkDailyReset(user.uid);
                // Load user data from Firestore
                loadUserData(user.uid);
                // Show loading screen for a moment, then fade into the app
                setTimeout(() => {
                    if (loadingScreen) {
                        loadingScreen.style.transition = 'opacity 0.5s ease-out';
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
                    }
                    if (window.showAppContent) window.showAppContent();
                }, 1200);
            } else {
                window.currentFirebaseUser = null;
                if (loadingScreen) loadingScreen.style.display = 'none';
                if (authOverlay) authOverlay.style.display = 'flex';
            }
        });

        // GUEST MODE - enter app without registering, data stays local only
        window.handleGuestMode = () => {
            const authOverlay = document.getElementById('auth-container');
            if (authOverlay) authOverlay.style.display = 'none';
            window.isGuestMode = true;
            window.currentFirebaseUser = null;
            if (window.showAppContent) window.showAppContent();
        };

        // 2. LOAD USER DATA FROM FIRESTORE
        async function loadUserData(uid) {
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.familyConfig) {
                    window.currentFamily = data.familyConfig;
                    if (window.renderAll) window.renderAll();
                }
            }
            // Start real-time sync
            startRealtimeSync(uid);
        }

        // 3. REAL-TIME SYNC (iPad <-> iPhone)
        function startRealtimeSync(uid) {
            onSnapshot(doc(db, "users", uid), (docSnap) => {
                const data = docSnap.data();
                if (data && data.familyConfig) {
                    window.currentFamily = data.familyConfig;
                    if (window.renderAll) window.renderAll();
                }
            });
        }

        // 4. THE LOGIN FUNCTIONS
        window.handleSignUp = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                document.getElementById('auth-error').innerText = error.message;
            }
        };

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                document.getElementById('auth-error').innerText = typeof t === 'function' ? t('loginFailed') : "Login failed. Check email/password.";
            }
        };

        // FORGOT PASSWORD FUNCTION
        window.handleForgotPassword = async () => {
            const email = document.getElementById('email').value;
            const errorEl = document.getElementById('auth-error');
            
            if (!email) {
                errorEl.innerText = typeof t === 'function' ? t('enterEmailFirst') : "Please enter your email address first.";
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                errorEl.style.color = "green";
                errorEl.innerText = typeof t === 'function' ? t('resetEmailSent') : "Reset email sent! Check your inbox.";
            } catch (error) {
                errorEl.style.color = "red";
                errorEl.innerText = "Error: " + error.message;
            }
        };

        // LOGOUT FUNCTION
        window.handleLogout = async () => {
            try {
                await auth.signOut();
                location.reload();
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        // 5. SAVE DATA TO CLOUD
        window.saveToFirebase = async () => {
            if (!window.currentFirebaseUser || window.isGuestMode) return;
            const docRef = doc(db, "users", window.currentFirebaseUser.uid);
            await setDoc(docRef, {
                familyConfig: window.currentFamily
            }, { merge: true });
        };

        // 6. DAILY RESET CHECK
        function checkDailyReset(uid) {
            const lastReset = localStorage.getItem('lastResetDate');
            const today = new Date().toLocaleDateString();

            if (lastReset !== today) {
                // It's a new day! Clear the Firestore document for this user
                setDoc(doc(db, "users", uid), {}, { merge: false })
                    .then(() => {
                        localStorage.setItem('lastResetDate', today);
                        console.log("Routine reset for the new day!");
                    });
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen (shown while Firebase checks auth) -->
    <div id="loading-screen" class="auth-overlay">
        <img src="loomi-word.png" class="auth-logo" alt="LOOMI" style="opacity: 0.7;">
    </div>

    <!-- Login Screen (hidden by default, shown only if not logged in) -->
    <div id="auth-container" class="auth-overlay" style="display:none;">
        <div class="auth-content">
            <img src="loomi-word.png" class="auth-logo" alt="LOOMI">
            <!-- Language toggle -->
            <div class="lang-toggle-wrapper">
                <img src="app-icon.png" class="lang-toggle-icon" alt="">
                <div class="lang-toggle-container">
                    <span id="lang-label-en" class="lang-label lang-inactive">English</span>
                    <button id="lang-toggle-btn" class="loomis-toggle-btn" onclick="toggleLanguage()">
                        <span class="toggle-slider"></span>
                    </button>
                    <span id="lang-label-he" class="lang-label lang-active">עברית</span>
                </div>
            </div>
            <div class="auth-box">
                <input type="email" id="email" placeholder="Email" oninput="document.getElementById('auth-error').innerText=''">
                <input type="password" id="password" placeholder="Password" oninput="document.getElementById('auth-error').innerText=''">
                <div class="auth-buttons">
                    <button onclick="handleLogin()">Login</button>
                    <button onclick="handleSignUp()">Sign Up</button>
                </div>
                <p class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</p>
                <p id="auth-error" style="color: red;"></p>
            </div>
            <p class="guest-link" onclick="handleGuestMode()">כניסה כאורח</p>
        </div>
    </div>

    <!-- Top bar with kids nav -->
    <header>
        <div id="header-kids-nav" class="beez-summary"></div>
    </header>

    <!-- Primary navigation grid -->
    <main id="view-home" class="view">
        <div class="menu-grid">
            <button onclick="showView('morning')" class="menu-card morning">
                <span class="material-symbols-rounded menu-icon">light_mode</span>
                <span class="menu-text">בוקר</span>
            </button>
            <button onclick="showView('evening')" class="menu-card evening">
                <span class="material-symbols-rounded menu-icon">dark_mode</span>
                <span class="menu-text">ערב</span>
            </button>
            <button onclick="showView('market')" class="menu-card market-card">
                <span class="material-symbols-rounded menu-icon">emoji_events</span>
                <span class="menu-text"> בנק משימות </span>
            </button>
            <button onclick="showView('week')" class="menu-card week">
                <span class="material-symbols-rounded menu-icon">calendar_month</span>
                <span class="menu-text">מה קורה השבוע? </span>
            </button>
        </div>
        <button onclick="showView('settings')" class="settings-btn home-settings-btn">ניהול והגדרות</button>
    </main>

    <!-- Routine carousel view -->
    <section id="view-routine" class="view hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0;"> שגרת בוקר </h2>
            <button onclick="showView('home')" class="back-btn">חזרה</button>
        </div>
        <div id="child-slider" class="snap-slider"></div>
    </section>

    <!-- Task market view -->
    <section id="view-market" class="view hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0;"> בנק המטלות </h2>
            <button onclick="showView('home')" class="back-btn">חזרה</button>
        </div>
        <div id="market-list"></div>
    </section>

    <!-- Weekly calendar view -->
    <section id="view-week" class="view hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0;"> מה קורה השבוע? </h2>
            <button onclick="showView('home')" class="back-btn">חזרה</button>
        </div>
        <div id="week-grid"></div>
    </section>

    <!-- Child personal page view -->
    <section id="view-child-page" class="view hidden">
        <div id="child-page-header" class="child-page-header">
            <h2 style="margin:0;">העמוד שלי</h2>
            <div class="header-loomis"></div>
            <button onclick="showView('home')" class="back-btn">חזרה</button>
        </div>
        <div id="child-page-content"></div>
    </section>

    <!-- Settings hub for events and routines -->
    <section id="view-settings" class="view hidden">
        <!-- Two-column layout: Left = Loomis + Tasks, Right = Save + Events -->
        <div class="settings-two-columns">
            <!-- RIGHT column (first in RTL): Save button + Events card -->
            <div class="settings-column">
                <div class="settings-column-header">
                    <button onclick="showView('home')" class="save-btn">שמור וסגור</button>
                </div>
                <!-- Event planner card -->
                <div class="settings-card settings-card-purple add-event-card">
                    <h3>הוסף אירוע</h3>
                    <input type="hidden" id="edit-event-idx" value="-1">
                    
                    <div class="type-toggle">
                        <button type="button" id="btn-weekly" class="active" onclick="setEventMode('weekly')">שבועי</button>
                        <button type="button" id="btn-once" onclick="setEventMode('once')">תאריך ספציפי</button>
                    </div>
                    
                    <!-- Row 1: Event name + Kid selector -->
                    <div class="event-row">
                        <input type="text" id="event-name" placeholder="מה קורה?" class="settings-card-input" style="flex:1;">
                        <select id="event-target" class="settings-card-select event-kid-select"></select>
                    </div>
                    
                    <!-- Row 2: Date/Day picker -->
                    <div class="event-row" id="date-input-container">
                        <div id="event-day-checkboxes" class="day-checkboxes"></div>
                        <input type="date" id="event-date" class="settings-card-input event-date-select" style="display:none;">
                    </div>
                    
                    <!-- Row 3: Time picker -->
                    <div class="event-row event-time-row">
                        <div class="time-group"><select id="start-h" class="mini-select-time"></select>:<select id="start-m" class="mini-select-time"></select></div>
                        <span class="time-arrow">→</span>
                        <div class="time-group"><select id="end-h" class="mini-select-time"></select>:<select id="end-m" class="mini-select-time"></select></div>
                    </div>
                    
                    <button onclick="addEvent()" class="settings-card-btn" id="btn-add-event">הוספה</button>
                    <button onclick="updateEvent()" class="settings-card-btn hidden" id="btn-update-event">עדכון</button>
                    <button onclick="cancelEditEvent()" class="settings-card-btn cancel-btn hidden" id="btn-cancel-edit">ביטול</button>
                    <div id="settings-event-list" class="settings-card-list"></div>
                </div>
            </div>

            <!-- LEFT column (second in RTL): Loomis toggle + Tasks card -->
            <div class="settings-column">
                <div class="settings-column-header">
                    <div class="loomis-toggle-container">
                        <span class="loomis-toggle-label">איסוף לומים</span>
                        <button id="loomis-toggle-btn" class="loomis-toggle-btn" onclick="toggleCollectLoomis()">
                            <span class="toggle-slider"></span>
                        </button>
                    </div>
                </div>
                <!-- Market chore card -->
                <div class="settings-card settings-card-green" id="settings-market-section">
                    <h3><i class="material-symbols-rounded" style="color:#5A9CB5;">checklist</i> הוסף משימה</h3>
                    <div class="add-task-row">
                        <input type="text" id="new-market-name" placeholder="מה שעושים?" class="settings-card-input">
                        <button onclick="addMarketItem()" class="settings-card-btn">הוספה</button>
                    </div>
                    <div id="market-items-list" class="settings-card-list"></div>
                </div>
            </div>
        </div>

        <!-- Bottom row: child cards horizontal scroll -->
        <div id="settings-child-list" class="settings-child-slider">
            <div id="settings-loading-text" style="color:#64748b; text-align:center; padding:20px; background:white; border-radius:15px; min-width:200px;">טוען...</div>
        </div>
        
        <div class="settings-bottom-bar">
            <button onclick="handleLogout()" class="logout-btn-small">התנתק</button>
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; font-size: 0.8rem; color: #777;">
        <p>&copy; 2026 LOOMI™ Home Routine. כל הזכויות שמורות.</p>
        <p>
            <a href="#" onclick="showPolicy('privacy')" style="color:#5A9CB5;text-decoration:underline;">Privacy Policy</a> | 
            <a href="#" onclick="showPolicy('terms')" style="color:#5A9CB5;text-decoration:underline;">Terms of Service</a>
        </p>
    </footer>

    <script src="i18n.js?v=2"></script>
    <script src="data.js?v=125"></script>
    <script src="app.js?v=149"></script>
</body>
